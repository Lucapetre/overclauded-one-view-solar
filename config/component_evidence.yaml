  w1_imt_si_rs485tc:
    family: weather
    outcome: include
    outcome_reason: >-
      Official Modbus spec (January 2026, FW 2.03, also FW 1.51-1.55) and selection table confirm the model's
      active registers 0, 7, 8, types, gains, ranges, firmware applicability and the 'unsupported optional
      register returns 0' behaviour. Register numbering is used directly as the protocol address (inferred).
    doc: {url: "https://imt-technology.com/fileadmin/docs/en/products/Si-RS485_Modbus_SPEC_EN.pdf", title: "Modbus Specification for Irradiance Sensors Si-RS485...-MB", version: "FW 2.03 (covers 1.51-1.55)", date: "January 2026", official: true}
    access_status: "documented, simulated for demo"
    device: {model: "IMT Si-RS485TC-T-Tm-MB (serial prefix 485-4; active registers 0, 7, 8)", firmware: ">= 1.53 required for registers 7/8; declare 2.03", accessories: "permanently connected PV module temperature sensor (3 m cable); no ambient/wind on this model"}
    acquisition: {path: "local documented read interface: Modbus RTU, function 0x04 Read Input Register (0x03 also supported)", collector: "site Modbus collector (simulated); factory default 9600 baud 8N1 address 1", authorization: "site collector permission (not established)"}
    cadence: {native: "not specified", chosen_polling_s: 60}
    conventions:
      register_numbering: {value: "'Register n' used as zero-based protocol address n", evidence_status: inferred, note: "the sheet lists Register 0, which can only be a PDU address"}
      unsupported_registers: "Registers 3, 8 and 9 are optional for some sensor types; unsupported => returns 0. For this model 3 and 9 are NOT active and must be marked unavailable, never ingested as 0 W/m2 / 0 m/s / 0 degC."
      mounting: "POA only if the asset registry declares in-plane mounting; the device name does not prove orientation."
      invalid_sentinel: {value: null, evidence_status: documented, note: "none documented; values outside data range (e.g. irradiance > 15000 raw) flagged by OUR bounds"}
