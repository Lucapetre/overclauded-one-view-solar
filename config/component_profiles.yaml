# Component profile registry (meters, batteries, weather) for the ONE shared ingestion engine.
#
# Every field below maps ONLY a native field/register listed in config/component_evidence.yaml for that profile
# (`evidence_ref` + `native_ref`; tests/test_components_profiles.py enforces it). Values ingested with these profiles
# are SYNTHETIC demonstration data generated by generate_components.py. No vendor credential, device or live API was
# used. Access status of every profile: "documented, simulated for demo" (see docs/COMPONENT_SOURCE_NOTES.md).
#
# Excluded by the feasibility gate: b3_enphase_battery_telemetry (no accessible response schema) -> no profile here.
# Delivered component source datasets: meters 3 (M1, M2, M3), batteries 2 (B1, B2), weather 3 (W1, W2, W3) = 8.
#
# This file `extends` the provider registry so the existing inverter profiles (used here only for the F2 mirrored
# meter evidence and the H1/H2 monitoring-path poll log) and canonical metrics are reused unchanged.
registry_version: "components-2026.11.15-1"
schema_version: 1
extends: [provider_profiles.yaml]
synthetic_notice: >-
  SYNTHETIC DEMONSTRATION. Component profiles are pinned to public references (docs/COMPONENT_SOURCE_NOTES.md);
  ingested values are generated fixtures, not real customer telemetry.

rule_versions:
  register_decode: "1.0"
  quality_gate: "1.0"
  sign_convention: "1.0"
  counter_segments: "1.0"
  authority: "1.0"
  header_csv: "1.0"

defaults:
  envelope_keys: [mock_transport, collector]
  # documented "normal" raw state values (anything else becomes a state episode for review; no diagnosis implied)
  normal_state_values:
    battery_alarm_raw: ["0"]
    sensor_status_raw: ["0"]
    meter_status_raw: ["0", "[]"]

excluded_profiles:
  - {profile_id: b3_enphase_battery_telemetry, family: battery, outcome: exclude, reason: "no accessible published response schema / interval semantics and no authorized sample; no fixture generated, no response shape invented"}

# Capability flags = DECLARATION (an asset at the site has a profile that maps the metric) kept separate from
# OBSERVATION (valid values actually seen). Evaluated per site / area resource by the engine; no vendor names.
capability_definitions:
  grid_power_measured:          {metrics_any: [grid_net_kw], boundary: grid_pcc, description: "net power at a declared PCC"}
  grid_energy_measured:         {metrics_any: [lifetime_grid_import_kwh, resettable_grid_import_kwh], boundary: grid_pcc, description: "directional energy counters at a declared PCC"}
  pcc_phase_voltage:            {metrics_any: [phase_voltage_v], boundary: grid_pcc, description: "per-phase RMS voltage at the PCC (sparse snapshots)"}
  battery_soc_available:        {metrics_any: [soc_pct], description: "reported SoC (last valid, never averaged)"}
  battery_limits_available:     {metrics_all: [battery_max_charge_current_a, battery_max_discharge_current_a], description: "BMS-reported charge/discharge current limits"}
  battery_alarms_available:     {metrics_any: [battery_alarm_raw], description: "documented battery alarm registers"}
  battery_energy_throughput:    {metrics_any: [lifetime_battery_charge_kwh, battery_net_kw], description: "battery throughput history"}
  irradiance_poa_available:     {metrics_any: [irradiance_wm2], mounting: poa, description: "plane-of-array irradiance (plane from asset registry)"}
  irradiance_ghi_available:     {metrics_any: [irradiance_wm2], mounting: horizontal, description: "horizontal irradiance"}
  module_temperature_available: {metrics_any: [module_temperature_c], description: "back-of-module temperature"}
  ambient_temperature_available: {metrics_any: [ambient_temperature_c], description: "shielded ambient temperature"}

units:
  "W/m2":  {dimension: irradiance, canonical: "W/m2", factor: 1.0}
  "W/m^2": {dimension: irradiance, canonical: "W/m2", factor: 1.0}
  "Deg C": {dimension: temperature, canonical: degC, factor: 1.0}
  Ah:      {dimension: charge, canonical: Ah, factor: 1.0}
  "m/s":   {dimension: speed, canonical: "m/s", factor: 1.0}

canonical_metrics:
  grid_net_kw:               {unit: kW, kind: power, description: "Net active power at a DECLARED grid/PCC boundary: + import, - export", bounds: {abs_max_ref: [device.pcc_capacity_kw, site.grid_connection_kw], max_factor: 1.5, on_exceed: out_of_range}}
  phase_active_power_kw:     {unit: kW, kind: power, description: "Per-phase net active power at the meter boundary (+ import / - export after configured orientation)", bounds: {abs_max_ref: [device.pcc_capacity_kw, site.grid_connection_kw], max_factor: 1.0, on_exceed: out_of_range}}
  lifetime_grid_import_kwh:  {unit: kWh, kind: energy_counter_lifetime, description: "Non-resettable cumulative import counter", bounds: {min: 0, max: 100000000, on_exceed: out_of_range}}
  lifetime_grid_export_kwh:  {unit: kWh, kind: energy_counter_lifetime, description: "Non-resettable cumulative export counter", bounds: {min: 0, max: 100000000, on_exceed: out_of_range}}
  resettable_grid_import_kwh: {unit: kWh, kind: energy_counter_resettable, description: "Documented-resettable cumulative import counter", bounds: {min: 0, max: 100000000, on_exceed: out_of_range}}
  resettable_grid_export_kwh: {unit: kWh, kind: energy_counter_resettable, description: "Documented-resettable cumulative export counter", bounds: {min: 0, max: 100000000, on_exceed: out_of_range}}
  meter_status_raw:          {unit: none, kind: state, description: "Native meter status/error code or list (raw; no physical diagnosis)"}
  battery_voltage_v:         {unit: V, kind: voltage, description: "Battery pack DC voltage", bounds: {min: 0, max: 100, on_exceed: out_of_range}}
  battery_current_a:         {unit: A, kind: current, description: "Battery DC current, canonical + discharge / - charge", bounds: {min: -1000, max: 1000, on_exceed: out_of_range}}
  battery_net_kw:            {unit: kW, kind: power, description: "Battery net power on the NAMED boundary: + discharge / - charge", bounds: {abs_max_ref: [device.rated_power_kw], max_factor: 1.5, on_exceed: out_of_range}}
  battery_alarm_raw:         {unit: none, kind: state, description: "Documented battery alarm register value (0 no alarm, 2 alarm)"}
  battery_max_charge_current_a:    {unit: A, kind: limit, description: "BMS-reported allowed charge current (not an operator setting)", bounds: {min: 0, max: 2000, on_exceed: out_of_range}}
  battery_max_discharge_current_a: {unit: A, kind: limit, description: "BMS-reported allowed discharge current", bounds: {min: 0, max: 2000, on_exceed: out_of_range}}
  battery_max_charge_voltage_v:    {unit: V, kind: limit, description: "BMS-reported max charge voltage", bounds: {min: 0, max: 100, on_exceed: out_of_range}}
  battery_min_discharge_voltage_v: {unit: V, kind: limit, description: "BMS-reported min discharge voltage", bounds: {min: 0, max: 100, on_exceed: out_of_range}}
  battery_capacity_ah:       {unit: Ah, kind: capacity, description: "Capacity basis reported by the battery service (Ah)", bounds: {min: 0, max: 10000, on_exceed: out_of_range}}
  irradiance_wm2:            {unit: "W/m2", kind: irradiance, description: "Irradiance; plane ONLY from asset-registry mounting (poa | horizontal), never from device name", bounds: {min: -50, max: 2000, on_exceed: out_of_range}}
  reference_cell_temperature_c: {unit: degC, kind: temperature, description: "Irradiance reference-cell temperature (not module, not ambient)", bounds: {min: -40, max: 100, on_exceed: out_of_range}}
  module_temperature_c:      {unit: degC, kind: temperature, description: "Back-of-module PV temperature sensor", bounds: {min: -40, max: 100, on_exceed: out_of_range}}
  ambient_temperature_c:     {unit: degC, kind: temperature, description: "Shielded ambient air temperature", bounds: {min: -40, max: 60, on_exceed: out_of_range}}
  sensor_body_temperature_c: {unit: degC, kind: temperature, description: "Radiometer instrument-body temperature (not ambient, not module)", bounds: {min: -40, max: 100, on_exceed: out_of_range}}
  sensor_status_raw:         {unit: none, kind: state, description: "Native sensor status/error register (raw)"}
  wind_speed_ms:             {unit: "m/s", kind: speed, description: "Declared only to record that the selected model does NOT provide it"}

profiles:
  # =====================================================================================================
  m1_schneider_iem3255_modbus:
    provider: schneider
    family: meter
    outcome: include
    evidence_ref: m1_schneider_iem3255_modbus
    display_name: "Schneider Electric iEM3255 - captured Modbus RTU register words (synthetic replay)"
    profile_version: "DOCA0005EN-16 (05/2026) register table; word order high-word-first CONFIGURED (inferred)"
    provenance: >-
      Register numbers, types, units and register = address + 1 from DOCA0005EN-16. Word order of Float32/Int64 is
      not stated in the manual and is a declared configuration. Int64 energy is decoded exactly (Python int) and
      converted Wh -> kWh as an exact decimal. No NaN sentinel is documented; non-finite Float32 is invalid (our rule).
    register_addressing: {register_minus_address: 1}
    transport:
      error_classes: {timeout: timeout, modbus_exception: provider_failure}
    endpoints:
      - endpoint_key: register_snapshot
        variant: iem3255_pcc
        input_format: ndjson_envelope
        route: []
        mapping_version: "m1-iem3255-1.0"
        realtime: false
        cadence_s: 300
        expected_delay_s: 60
        cadence_note: "chosen simulated collection cadence: 300 s polling (native refresh rate not specified)"
        records:
          iterate: []
          device_id: {path: envelope.binding.asset_id, required: true}
          entity_scope: meter
          identity_checks:
            - {path: envelope.request_scope.unit_id, ref: device.modbus_unit_id, code: unit_id_mismatch}
            - {path: device.boundary, equals: grid_pcc, code: boundary_not_declared_grid_pcc}
          decode_suspect_threshold: 2
          times:
            - {role: capture_time, path: envelope.recorded_at_utc, format: iso_offset, is_measurement: false, required: true}
          effective_time_roles: [capture_time]
          known_keys: [{path: payload, keys: [unit_id, function_code, blocks]}]
        entities:
          - scope: meter
            fields:
              - {id: m1.p_total, native_ref: "Total Active Power", transform: register_words, source: payload.blocks, register: {number: 3060, address: 3059, type: float32, word_order: high_word_first}, metric: grid_net_kw, unit: kW, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: documented_word_order_configured}
              - {id: m1.p_l1, native_ref: "Active Power Phase 1/2/3", transform: register_words, source: payload.blocks, register: {number: 3054, address: 3053, type: float32, word_order: high_word_first}, metric: phase_active_power_kw, channel: L1, phase: L1, unit: kW, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: documented_word_order_configured}
              - {id: m1.p_l2, native_ref: "Active Power Phase 1/2/3", transform: register_words, source: payload.blocks, register: {number: 3056, address: 3055, type: float32, word_order: high_word_first}, metric: phase_active_power_kw, channel: L2, phase: L2, unit: kW, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: documented_word_order_configured}
              - {id: m1.p_l3, native_ref: "Active Power Phase 1/2/3", transform: register_words, source: payload.blocks, register: {number: 3058, address: 3057, type: float32, word_order: high_word_first}, metric: phase_active_power_kw, channel: L3, phase: L3, unit: kW, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: documented_word_order_configured}
              - {id: m1.v_l1, native_ref: "Voltage L1-N / L2-N / L3-N", transform: register_words, source: payload.blocks, register: {number: 3028, address: 3027, type: float32, word_order: high_word_first}, metric: phase_voltage_v, channel: L1, phase: L1, unit: V, boundary: grid_pcc, aggregation: instantaneous}
              - {id: m1.v_l2, native_ref: "Voltage L1-N / L2-N / L3-N", transform: register_words, source: payload.blocks, register: {number: 3030, address: 3029, type: float32, word_order: high_word_first}, metric: phase_voltage_v, channel: L2, phase: L2, unit: V, boundary: grid_pcc, aggregation: instantaneous}
              - {id: m1.v_l3, native_ref: "Voltage L1-N / L2-N / L3-N", transform: register_words, source: payload.blocks, register: {number: 3032, address: 3031, type: float32, word_order: high_word_first}, metric: phase_voltage_v, channel: L3, phase: L3, unit: V, boundary: grid_pcc, aggregation: instantaneous}
              - {id: m1.i_l1, native_ref: "I1/I2/I3 phase current", transform: register_words, source: payload.blocks, register: {number: 3000, address: 2999, type: float32, word_order: high_word_first}, metric: ac_current_a, channel: L1, phase: L1, unit: A, boundary: grid_pcc, aggregation: instantaneous}
              - {id: m1.i_l2, native_ref: "I1/I2/I3 phase current", transform: register_words, source: payload.blocks, register: {number: 3002, address: 3001, type: float32, word_order: high_word_first}, metric: ac_current_a, channel: L2, phase: L2, unit: A, boundary: grid_pcc, aggregation: instantaneous}
              - {id: m1.i_l3, native_ref: "I1/I2/I3 phase current", transform: register_words, source: payload.blocks, register: {number: 3004, address: 3003, type: float32, word_order: high_word_first}, metric: ac_current_a, channel: L3, phase: L3, unit: A, boundary: grid_pcc, aggregation: instantaneous}
              - {id: m1.freq, native_ref: "Frequency", transform: register_words, source: payload.blocks, register: {number: 3110, address: 3109, type: float32, word_order: high_word_first}, metric: grid_frequency_hz, unit: Hz, boundary: grid_pcc, aggregation: instantaneous}
              - {id: m1.e_import, native_ref: "Total Active Energy Import (cannot be reset)", transform: register_words, source: payload.blocks, register: {number: 3204, address: 3203, type: int64, word_order: high_word_first}, metric: lifetime_grid_import_kwh, unit: Wh, boundary: grid_pcc, aggregation: cumulative_counter_lifetime, assumption_basis: documented_int64_exact}
              - {id: m1.e_export, native_ref: "Total Active Energy Export (cannot be reset)", transform: register_words, source: payload.blocks, register: {number: 3208, address: 3207, type: int64, word_order: high_word_first}, metric: lifetime_grid_export_kwh, unit: Wh, boundary: grid_pcc, aggregation: cumulative_counter_lifetime, assumption_basis: documented_int64_exact}
              - {id: m1.diag, native_ref: "Diagnostics error status (bitmap; bit5 = Code 204 total active energy negative due to incorrect voltage or current connections)", transform: register_words, source: payload.blocks, register: {number: 45000, address: 44999, type: uint16}, metric: meter_status_raw, channel: diagnostics_bitmap, aggregation: state}
        derive:
          - {id: m1.import_from_counter, method: counter_difference, from_metric: lifetime_grid_import_kwh, to_metric: interval_grid_import_kwh, counter: lifetime_nonresettable, priority: 1, max_gap_s: 900, max_rate_ref: [device.pcc_capacity_kw], max_rate_factor: 1.3, resolution: 0.001}
          - {id: m1.export_from_counter, method: counter_difference, from_metric: lifetime_grid_export_kwh, to_metric: interval_grid_export_kwh, counter: lifetime_nonresettable, priority: 1, max_gap_s: 900, max_rate_ref: [device.pcc_capacity_kw], max_rate_factor: 1.3, resolution: 0.001}
          - {id: m1.import_est, method: power_integration, from_metric: grid_net_kw, to_metric: interval_grid_import_kwh, component: positive, hold: previous_sample, max_gap_s: 600, priority: 2}
          - {id: m1.export_est, method: power_integration, from_metric: grid_net_kw, to_metric: interval_grid_export_kwh, component: negative, hold: previous_sample, max_gap_s: 600, priority: 2}

  # =====================================================================================================
  m2_fronius_smart_meter_solar_api:
    provider: fronius
    family: meter
    outcome: narrow
    evidence_ref: m2_fronius_smart_meter_solar_api
    display_name: "Fronius Smart Meter 63A-3 via Solar API GetMeterRealtimeData (synthetic replay)"
    profile_version: "Solar API V1 42,0410,2012,EN rev 021-15052025; meter channel units INFERRED (W, Wh, V, A, Hz)"
    provenance: >-
      Body.Data.{DeviceId} nesting, Meter_Location_Current sign rules, Visible/Enable gates and the 63A-3 channel
      table from the official Fronius PDF. Units are not tabulated in the meter section (inferred). Only
      Meter_Location_Current = 0 (feed-in / grid interconnection point) maps to grid_net_kw; a mismatch with the
      registry boundary quarantines the record. Not paired with GEN24 sites. Head.Timestamp is response time only.
    numeric: {allow_numeric_strings: false, decimal_separator: ".", thousands_separator: null}
    transport:
      http_status_classes: {"400": request_validation_error, "403": access_denied, "404": not_found, "500": server_error, "503": server_error}
      error_classes: {timeout: timeout}
    failure_detection:
      - when: {path: payload.Head.Status.Code, op: ne, value: 0}
        code_path: payload.Head.Status.Code
        message_path: payload.Head.Status.Reason
        default_class: provider_failure
    endpoints:
      - endpoint_key: GetMeterRealtimeData
        variant: smart_meter_63a3_system_scope
        input_format: ndjson_envelope
        route: []
        mapping_version: "m2-fr-meter-1.0"
        realtime: true
        cadence_s: 300
        expected_delay_s: 60
        cadence_note: "chosen simulated collection cadence: 300 s polling (native rate not specified)"
        records:
          iterate: [{alias: dev, path: payload.Body.Data, kind: map}]
          device_id: {path: dev.Details.Serial, required: true}
          entity_scope: meter
          identity_checks:
            - {path: envelope.binding.asset_id, ref: device.asset_id, code: asset_serial_mismatch}
            - {path: dev.Meter_Location_Current, ref: device.meter_location_code, code: meter_location_boundary_mismatch}
            - {path: device.boundary, equals: grid_pcc, code: boundary_not_declared_grid_pcc}
          withhold_if:
            - {when: {path: dev.Visible, op: eq, value: 0}, flag: source_marked_incomplete, reason: "Visible = 0: 'incomplete or outdated values' (documented quality gate)"}
            - {when: {path: dev.Enable, op: eq, value: 0}, flag: source_disabled, reason: "Enable = 0: meter disabled (documented)"}
          times:
            - {role: device_timestamp, path: dev.TimeStamp, format: epoch_s, is_measurement: true, required: true}
            - {role: response_time, path: payload.Head.Timestamp, format: iso_offset, is_measurement: false, is_response: true}
          effective_time_roles: [device_timestamp]
          known_keys:
            - {path: payload, keys: [Body, Head]}
            - {path: dev, keys: [Details, Enable, Visible, Meter_Location_Current, TimeStamp, PowerReal_P_Sum, PowerReal_P_Phase_1, PowerReal_P_Phase_2, PowerReal_P_Phase_3, EnergyReal_WAC_Sum_Consumed, EnergyReal_WAC_Sum_Produced, Voltage_AC_Phase_1, Voltage_AC_Phase_2, Voltage_AC_Phase_3, Current_AC_Phase_1, Current_AC_Phase_2, Current_AC_Phase_3, Frequency_Phase_Average]}
            - {path: dev.Details, keys: [Serial, Model, Manufacturer]}
        entities:
          - scope: meter
            fields:
              - {id: m2.p_sum, native_ref: "PowerReal_P_Sum", source: dev.PowerReal_P_Sum, metric: grid_net_kw, unit: W, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: documented_sign_at_location_0_unit_inferred, evidence_status: documented_unit_inferred}
              - {id: m2.p_l1, native_ref: "PowerReal_P_Phase_1/2/3", source: dev.PowerReal_P_Phase_1, metric: phase_active_power_kw, channel: L1, phase: L1, unit: W, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: unit_inferred}
              - {id: m2.p_l2, native_ref: "PowerReal_P_Phase_1/2/3", source: dev.PowerReal_P_Phase_2, metric: phase_active_power_kw, channel: L2, phase: L2, unit: W, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: unit_inferred}
              - {id: m2.p_l3, native_ref: "PowerReal_P_Phase_1/2/3", source: dev.PowerReal_P_Phase_3, metric: phase_active_power_kw, channel: L3, phase: L3, unit: W, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: unit_inferred}
              - {id: m2.e_consumed, native_ref: "EnergyReal_WAC_Sum_Consumed", source: dev.EnergyReal_WAC_Sum_Consumed, metric: lifetime_grid_import_kwh, unit: Wh, boundary: grid_pcc, aggregation: cumulative_counter_lifetime, assumption_basis: import_at_location_0_unit_inferred}
              - {id: m2.e_produced, native_ref: "EnergyReal_WAC_Sum_Produced", source: dev.EnergyReal_WAC_Sum_Produced, metric: lifetime_grid_export_kwh, unit: Wh, boundary: grid_pcc, aggregation: cumulative_counter_lifetime, assumption_basis: export_at_location_0_unit_inferred}
              - {id: m2.v_l1, native_ref: "Voltage_AC_Phase_1/2/3", source: dev.Voltage_AC_Phase_1, metric: phase_voltage_v, channel: L1, phase: L1, unit: V, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: unit_inferred}
              - {id: m2.v_l2, native_ref: "Voltage_AC_Phase_1/2/3", source: dev.Voltage_AC_Phase_2, metric: phase_voltage_v, channel: L2, phase: L2, unit: V, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: unit_inferred}
              - {id: m2.v_l3, native_ref: "Voltage_AC_Phase_1/2/3", source: dev.Voltage_AC_Phase_3, metric: phase_voltage_v, channel: L3, phase: L3, unit: V, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: unit_inferred}
              - {id: m2.i_l1, native_ref: "Current_AC_Phase_1/2/3", source: dev.Current_AC_Phase_1, metric: ac_current_a, channel: L1, phase: L1, unit: A, boundary: grid_pcc, aggregation: instantaneous, expect_sign: nonnegative, assumption_basis: absolute_value_magnitude_only}
              - {id: m2.i_l2, native_ref: "Current_AC_Phase_1/2/3", source: dev.Current_AC_Phase_2, metric: ac_current_a, channel: L2, phase: L2, unit: A, boundary: grid_pcc, aggregation: instantaneous, expect_sign: nonnegative, assumption_basis: absolute_value_magnitude_only}
              - {id: m2.i_l3, native_ref: "Current_AC_Phase_1/2/3", source: dev.Current_AC_Phase_3, metric: ac_current_a, channel: L3, phase: L3, unit: A, boundary: grid_pcc, aggregation: instantaneous, expect_sign: nonnegative, assumption_basis: absolute_value_magnitude_only}
              - {id: m2.freq, native_ref: "Frequency_Phase_Average", source: dev.Frequency_Phase_Average, metric: grid_frequency_hz, unit: Hz, boundary: grid_pcc, aggregation: instantaneous, assumption_basis: unit_inferred}
        derive:
          - {id: m2.import_from_counter, method: counter_difference, from_metric: lifetime_grid_import_kwh, to_metric: interval_grid_import_kwh, counter: lifetime_nonresettable, priority: 1, max_gap_s: 900, max_rate_ref: [device.pcc_capacity_kw, site.grid_connection_kw], max_rate_factor: 1.3, resolution: 0.001}
          - {id: m2.export_from_counter, method: counter_difference, from_metric: lifetime_grid_export_kwh, to_metric: interval_grid_export_kwh, counter: lifetime_nonresettable, priority: 1, max_gap_s: 900, max_rate_ref: [device.pcc_capacity_kw, site.grid_connection_kw], max_rate_factor: 1.3, resolution: 0.001}
          - {id: m2.import_est, method: power_integration, from_metric: grid_net_kw, to_metric: interval_grid_import_kwh, component: positive, hold: previous_sample, max_gap_s: 600, priority: 2}
          - {id: m2.export_est, method: power_integration, from_metric: grid_net_kw, to_metric: interval_grid_export_kwh, component: negative, hold: previous_sample, max_gap_s: 600, priority: 2}

  # =====================================================================================================
  m3_shelly_pro3em_rpc:
    provider: shelly
    family: meter
    outcome: include
    evidence_ref: m3_shelly_pro3em_rpc
    display_name: "Shelly Pro 3EM (triphase profile) Gen2 RPC EM.GetStatus / EMData.GetStatus (synthetic replay)"
    profile_version: "Shelly Gen2 API EM / EMData pages (Version 1.0, accessed 2026-11-15); total_act_power unit and act_power sign INFERRED"
    provenance: >-
      Separate EM.GetStatus (instantaneous) and EMData.GetStatus (directional energy counters, Wh) payloads.
      GetStatus carries no measurement time: the collector capture time is the time anchor. EMData counters are
      documented resettable (EMData.ResetCounters): a decrease starts a new counter segment. CT orientation is
      declared in the asset registry; nothing is auto-flipped.
    numeric: {allow_numeric_strings: false, decimal_separator: ".", thousands_separator: null}
    transport:
      http_status_classes: {"401": auth_failed, "404": not_found, "500": server_error, "503": server_error}
      error_classes: {timeout: timeout}
    endpoints:
      - endpoint_key: EM.GetStatus
        variant: pro3em_triphase_em0
        input_format: ndjson_envelope
        route: []
        mapping_version: "m3-em-1.0"
        realtime: true
        cadence_s: 300
        expected_delay_s: 60
        cadence_note: "chosen simulated collection cadence: 300 s polling"
        records:
