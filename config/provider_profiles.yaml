        records:
          iterate: []
          device_id: {path: payload.Head.RequestArguments.DeviceId, required: true}
          entity_scope: inverter
          times:
            - {role: response_time, path: payload.Head.Timestamp, format: iso_offset, is_measurement: false, is_response: true, required: true}
          effective_time_roles: [response_time]
          known_keys:
            - {path: payload.Body.Data, keys: [DAY_ENERGY, DeviceStatus, FAC, IAC, IDC, PAC, TOTAL_ENERGY, UAC, UDC, YEAR_ENERGY]}
        entities:
          - scope: inverter
            fields: &fronius_cid_fields
              - {id: frcid.PAC, source: payload.Body.Data.PAC, metric: inverter_ac_output_kw, transform: value_object, allowed_units: [W, kW], boundary: ac_inverter_output, presence: optional, requirement: optional, evidence: "R6 CommonInverterData PAC {Unit,Value}"}
              - {id: frcid.UAC, source: payload.Body.Data.UAC, metric: ac_voltage_v, transform: value_object, allowed_units: [V], boundary: ac_phase, presence: optional, requirement: optional, evidence: "R6 CommonInverterData UAC"}
              - {id: frcid.IAC, source: payload.Body.Data.IAC, metric: ac_current_a, transform: value_object, allowed_units: [A], boundary: ac_phase, presence: optional, requirement: optional, evidence: "R6 CommonInverterData IAC"}
              - {id: frcid.FAC, source: payload.Body.Data.FAC, metric: grid_frequency_hz, transform: value_object, allowed_units: [Hz], boundary: ac_grid, presence: optional, requirement: optional, evidence: "R6 CommonInverterData FAC"}
              - {id: frcid.UDC, source: payload.Body.Data.UDC, metric: dc_input_voltage_v, transform: value_object, allowed_units: [V], boundary: dc_input, presence: optional, requirement: optional, evidence: "R6 CommonInverterData UDC"}
              - {id: frcid.IDC, source: payload.Body.Data.IDC, metric: dc_input_current_a, transform: value_object, allowed_units: [A], boundary: dc_input, presence: optional, requirement: optional, evidence: "R6 CommonInverterData IDC"}
              - {id: frcid.TOTAL_ENERGY, source: payload.Body.Data.TOTAL_ENERGY, metric: lifetime_yield_kwh, transform: value_object, allowed_units: [Wh, kWh], boundary: ac_inverter_output, presence: optional, requirement: optional, evidence: "R6 CommonInverterData TOTAL_ENERGY"}
              - {id: frcid.StatusCode, source: payload.Body.Data.DeviceStatus.StatusCode, metric: inverter_state_raw, transform: state, presence: optional, requirement: optional, status_map: {"7": running, "8": standby}, status_map_evidence: "R6 DeviceStatus.StatusCode table for SnapInverter (verify; unmapped codes kept raw)", evidence: "R6 DeviceStatus"}
        derive: []

      - endpoint_key: GetInverterRealtimeData.CommonInverterData
        variant: gen24_hybrid
        route: [{path: site.profile_variant, op: eq, value: gen24_hybrid}]
        mapping_version: "fr-cid-gen24-1.0"
        realtime: true
        cadence_s: 300
        expected_delay_s: 30
        stale_after_s: 120
        records:
          iterate: []
          device_id: {path: payload.Head.RequestArguments.DeviceId, required: true}
          entity_scope: inverter
          times:
            - {role: response_time, path: payload.Head.Timestamp, format: iso_offset, is_measurement: false, is_response: true, required: true}
          effective_time_roles: [response_time]
          known_keys:
            - {path: payload.Body.Data, keys: [DAY_ENERGY, DeviceStatus, FAC, IAC, IDC, PAC, TOTAL_ENERGY, UAC, UDC, YEAR_ENERGY]}
        entities:
          - scope: inverter
            fields:
              - {id: frcid.PAC, source: payload.Body.Data.PAC, metric: inverter_ac_output_kw, transform: value_object, allowed_units: [W, kW], boundary: ac_inverter_output, presence: optional, requirement: optional, evidence: "R6 CommonInverterData PAC {Unit,Value}"}
              - {id: frcid.UAC, source: payload.Body.Data.UAC, metric: ac_voltage_v, transform: value_object, allowed_units: [V], boundary: ac_phase, presence: optional, requirement: optional, evidence: "R6 CommonInverterData UAC"}
              - {id: frcid.IAC, source: payload.Body.Data.IAC, metric: ac_current_a, transform: value_object, allowed_units: [A], boundary: ac_phase, presence: optional, requirement: optional, evidence: "R6 CommonInverterData IAC"}
              - {id: frcid.FAC, source: payload.Body.Data.FAC, metric: grid_frequency_hz, transform: value_object, allowed_units: [Hz], boundary: ac_grid, presence: optional, requirement: optional, evidence: "R6 CommonInverterData FAC"}
              - {id: frcid.UDC, source: payload.Body.Data.UDC, metric: dc_input_voltage_v, transform: value_object, allowed_units: [V], boundary: dc_input, presence: optional, requirement: optional, evidence: "R6 CommonInverterData UDC"}
              - {id: frcid.IDC, source: payload.Body.Data.IDC, metric: dc_input_current_a, transform: value_object, allowed_units: [A], boundary: dc_input, presence: optional, requirement: optional, evidence: "R6 CommonInverterData IDC"}
              - {id: frcid.TOTAL_ENERGY, source: payload.Body.Data.TOTAL_ENERGY, metric: lifetime_yield_kwh, transform: value_object, allowed_units: [Wh, kWh], boundary: ac_inverter_output, presence: optional, requirement: optional, evidence: "R6 CommonInverterData TOTAL_ENERGY"}
              - {id: frcid.StatusCode.gen24, source: payload.Body.Data.DeviceStatus.StatusCode, metric: inverter_state_raw, transform: state, presence: optional, requirement: optional, evidence: "R6 DeviceStatus (GEN24 codes not mapped; raw kept)"}
        derive: []

  # =====================================================================================
  solaredge_monitoring_api_2026_03:
    provider: solaredge
    display_name: "SolarEdge Monitoring Server API (legacy, JSON; synthetic replay)"
    profile_version: "Monitoring Server API reference, version updated March 2026 (JSON only)"
    evidence: [R7]
    provenance: >-
      Official SolarEdge PDF (R7). The mock does not implement any newer API generation and does not
      mix its authentication/version with this contract. Local naive timestamps use the SITE timezone.
    numeric: {allow_numeric_strings: false, decimal_separator: ".", thousands_separator: null}
    transport:
      http_status_classes: {"400": request_validation_error, "403": access_denied, "404": not_found, "429": rate_limited, "500": server_error, "503": server_error}
    failure_detection: []
    endpoints:
      - endpoint_key: equipment_data
        variant: inverter_technical_data
        route: []
        mapping_version: "se-tel-1.0"
        mapping_versions:
          - version: "se-tel-1.1-synthetic-alias"
            detect: {path: tel.inverterTemperature, op: present}
            aliases: {tel.temperature: tel.inverterTemperature}
            extra_known_keys: [{path: tel, keys: [inverterTemperature]}]
            note: "SYNTHETIC schema-drift test registered for the demo; NOT a documented SolarEdge change."
        realtime: false
        cadence_s: 900
        expected_delay_s: 1800
        request_window:
          start: {path: envelope.request_scope.query.startTime, format: local_naive, pattern: "%Y-%m-%d %H:%M:%S"}
          end: {path: envelope.request_scope.query.endTime, format: local_naive, pattern: "%Y-%m-%d %H:%M:%S"}
        records:
          iterate: [{alias: tel, path: payload.data.telemetries, kind: list}]
          device_id: {path: envelope.request_scope.serialNumber, required: true}
          entity_scope: inverter
          times:
            - {role: local_measurement_time, path: tel.date, format: local_naive, pattern: "%Y-%m-%d %H:%M:%S", is_measurement: true, required: true}
          effective_time_roles: [local_measurement_time]
          known_keys:
            - {path: tel, keys: [date, totalActivePower, dcVoltage, groundFaultResistance, powerLimit, totalEnergy, temperature, inverterMode, operationMode, L1Data, L2Data, L3Data, vL1To2, vL2To3, vL3To1]}
        entities:
          - scope: inverter
            fields:
              - {id: setel.totalActivePower, source: tel.totalActivePower, metric: inverter_ac_output_kw, unit: W, boundary: ac_inverter_output, presence: optional, requirement: optional, evidence: "R7 Inverter Technical Data totalActivePower (W)"}
              - {id: setel.totalEnergy, source: tel.totalEnergy, metric: lifetime_yield_kwh, unit: Wh, boundary: ac_inverter_output, presence: optional, requirement: optional, evidence: "R7 totalEnergy (Wh, lifetime)"}
              - {id: setel.temperature, source: tel.temperature, metric: inverter_temperature_c, unit: degC, boundary: inverter_internal, presence: optional, requirement: optional, evidence: "R7 temperature (inverter)"}
              - {id: setel.dcVoltage, source: tel.dcVoltage, metric: dc_input_voltage_v, unit: V, boundary: dc_input, presence: optional, requirement: optional, evidence: "R7 dcVoltage"}
              - {id: setel.inverterMode, source: tel.inverterMode, metric: inverter_state_raw, transform: state, presence: optional, requirement: optional, evidence: "R7 inverterMode (raw enum kept)"}
              - {id: setel.L1.acVoltage, source: tel.L1Data.acVoltage, metric: phase_voltage_v, channel: L1, unit: V, boundary: ac_phase, presence: optional, requirement: optional, evidence: "R7 L1Data.acVoltage"}
              - {id: setel.L2.acVoltage, source: tel.L2Data.acVoltage, metric: phase_voltage_v, channel: L2, unit: V, boundary: ac_phase, presence: optional, requirement: optional, applies_if: {path: device.phase_count, op: gte, value: 2}, evidence: "R7 L2Data.acVoltage (three-phase only)"}
              - {id: setel.L3.acVoltage, source: tel.L3Data.acVoltage, metric: phase_voltage_v, channel: L3, unit: V, boundary: ac_phase, presence: optional, requirement: optional, applies_if: {path: device.phase_count, op: gte, value: 3}, evidence: "R7 L3Data.acVoltage (three-phase only)"}
              - {id: setel.L1.acFrequency, source: tel.L1Data.acFrequency, metric: grid_frequency_hz, unit: Hz, boundary: ac_grid, presence: optional, requirement: optional, evidence: "R7 L1Data.acFrequency"}
        derive:
          - {id: setel.interval_from_totalEnergy, method: counter_difference, from_metric: lifetime_yield_kwh, to_metric: interval_yield_kwh, counter: lifetime, priority: 1, max_gap_s: 2700, max_rate_ref: [device.max_ac_kw, device.rated_ac_kw], max_rate_factor: 1.3, resolution: 0.002}

      - endpoint_key: currentPowerFlow
        variant: site_power_flow
        route: []
        mapping_version: "se-pf-1.0"
        realtime: true
        cadence_s: 900
        expected_delay_s: 120
        empty_response: {when_path_empty: payload, state: unsupported, capability: site_power_flow,
                         note: "R7: an unsupported site returns an empty object; NOT a zero-load home"}
        records:
          iterate: []
          entity_scope: site
          times:
            # The response carries no timestamp; the capture time is the only time anchor.
            - {role: capture_time, path: envelope.recorded_at_utc, format: iso_offset, is_measurement: false, required: true}
          effective_time_roles: [capture_time]
          known_keys:
            - {path: payload, keys: [siteCurrentPowerFlow]}
            - {path: payload.siteCurrentPowerFlow, keys: [updateRefreshRate, unit, connections, GRID, LOAD, PV, STORAGE]}
        entities:
          - scope: site
            fields:
              - id: sepf.flows
                transform: edge_flow
                source: payload.siteCurrentPowerFlow
                unit_from: payload.siteCurrentPowerFlow.unit
                allowed_units: [kW, W]
                connections_path: payload.siteCurrentPowerFlow.connections
                magnitude_key: currentPower
                edge_keys: {from: from, to: to}
                node_case_insensitive: true
                presence: required
                requirement: vendor_response_required
                assumption_basis: documented_edge_direction
                evidence: "R7 currentPowerFlow: currentPower is a nonnegative magnitude; connections give direction"
                outputs:
                  - {metric: grid_import_kw, node: GRID, boundary: site_grid_connection, requires_capability: grid_meter, direction_any: [[GRID, LOAD], [GRID, STORAGE]], opposite_any: [[LOAD, GRID], [PV, GRID], [STORAGE, GRID]]}
                  - {metric: grid_export_kw, node: GRID, boundary: site_grid_connection, requires_capability: grid_meter, direction_any: [[LOAD, GRID], [PV, GRID], [STORAGE, GRID]], opposite_any: [[GRID, LOAD], [GRID, STORAGE]]}
                  - {metric: household_load_kw, node: LOAD, boundary: site_load, requires_capability: grid_meter, direction: none}
                  - {metric: pv_production_kw, node: PV, boundary: site_flow_unspecified, direction: none}
                  - {metric: battery_charge_kw, node: STORAGE, boundary: battery_flow, requires_capability: battery, direction_any: [[PV, STORAGE], [LOAD, STORAGE], [GRID, STORAGE]], opposite_any: [[STORAGE, LOAD], [STORAGE, GRID]]}
                  - {metric: battery_discharge_kw, node: STORAGE, boundary: battery_flow, requires_capability: battery, direction_any: [[STORAGE, LOAD], [STORAGE, GRID]], opposite_any: [[PV, STORAGE], [LOAD, STORAGE], [GRID, STORAGE]]}
              - {id: sepf.chargeLevel, source: payload.siteCurrentPowerFlow.STORAGE.chargeLevel, metric: soc_pct, unit: pct, boundary: battery, presence: optional, requirement: optional, requires_capability: battery, evidence: "R7 STORAGE.chargeLevel (%)"}
        derive:
          - {id: sepf.import_est, method: power_integration, from_metric: grid_import_kw, to_metric: interval_grid_import_kwh, max_gap_s: 1200}
          - {id: sepf.export_est, method: power_integration, from_metric: grid_export_kw, to_metric: interval_grid_export_kwh, max_gap_s: 1200}
          - {id: sepf.load_est, method: power_integration, from_metric: household_load_kw, to_metric: interval_household_load_kwh, max_gap_s: 1200}

      - endpoint_key: storageData
        variant: storage_information
        route: []
        mapping_version: "se-storage-1.0"
        realtime: false
        cadence_s: 900
        expected_delay_s: 1800
        request_window:
          start: {path: envelope.request_scope.query.startTime, format: local_naive, pattern: "%Y-%m-%d %H:%M:%S"}
          end: {path: envelope.request_scope.query.endTime, format: local_naive, pattern: "%Y-%m-%d %H:%M:%S"}
        records:
          iterate: [{alias: bat, path: payload.storageData.batteries, kind: list}, {alias: tel, path: bat.telemetries, kind: list}]
          device_id: {path: bat.serialNumber, required: true}
          entity_scope: battery
          times:
            - {role: local_measurement_time, path: tel.timeStamp, format: local_naive, pattern: "%Y-%m-%d %H:%M:%S", is_measurement: true, required: true}
          effective_time_roles: [local_measurement_time]
          known_keys:
            - {path: tel, keys: [timeStamp, power, batteryState, lifeTimeEnergyDischarged, lifeTimeEnergyCharged, fullPackEnergyAvailable, internalTemp, ACGridCharging, stateOfCharge]}
        entities:
          - scope: battery
            fields:
              - {id: sest.power, source: tel.power, transform: sign_split, sign_split: {positive: battery_charge_kw, negative: battery_discharge_kw}, unit: W, boundary: dc_battery, presence: optional, requirement: optional, assumption_basis: documented_sign, evidence: "R7 storageData power: + charging / - discharging (differs from currentPowerFlow)"}
              - {id: sest.stateOfCharge, source: tel.stateOfCharge, metric: soc_pct, unit: pct, boundary: battery, presence: optional, requirement: optional, evidence: "R7 stateOfCharge"}
              - {id: sest.internalTemp, source: tel.internalTemp, metric: battery_temperature_c, unit: degC, boundary: battery_internal, presence: optional, requirement: optional, evidence: "R7 internalTemp (battery; never merged with inverter temperature)"}
              - {id: sest.batteryState, source: tel.batteryState, metric: battery_state_raw, transform: state, presence: optional, requirement: optional, evidence: "R7 batteryState (raw)"}
              - {id: sest.lifeTimeEnergyCharged, source: tel.lifeTimeEnergyCharged, metric: lifetime_battery_charge_kwh, unit: Wh, boundary: dc_battery, presence: optional, requirement: optional, evidence: "R7 lifeTimeEnergyCharged (Wh)"}
              - {id: sest.lifeTimeEnergyDischarged, source: tel.lifeTimeEnergyDischarged, metric: lifetime_battery_discharge_kwh, unit: Wh, boundary: dc_battery, presence: optional, requirement: optional, evidence: "R7 lifeTimeEnergyDischarged (Wh)"}
        derive:
          - {id: sest.charge_interval, method: counter_difference, from_metric: lifetime_battery_charge_kwh, to_metric: interval_battery_charge_kwh, counter: lifetime, priority: 1, max_gap_s: 2700, max_rate_ref: [device.rated_power_kw], max_rate_factor: 1.3, resolution: 0.002}
          - {id: sest.discharge_interval, method: counter_difference, from_metric: lifetime_battery_discharge_kwh, to_metric: interval_battery_discharge_kwh, counter: lifetime, priority: 1, max_gap_s: 2700, max_rate_ref: [device.rated_power_kw], max_rate_factor: 1.3, resolution: 0.002}
