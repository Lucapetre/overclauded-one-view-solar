  # =====================================================================================================
  w2_kipp_smp10x_modbus:
    family: weather
    outcome: include
    outcome_reason: >-
      Official manual (0374214 | 02-0326, data model 108) gives the input register table with PDU addresses,
      types, scale-factor rule, body temperature scaling and status-flag bits. Float32 registers (10006+) are not
      used because their word order is not stated; the S16 registers are used with the scale-factor register.
    doc: {url: "https://cdn.hach.com/1XMCM0ZF/at/4vgjr9542w2f29hsgjbhsqtb/Operational_Manual_SMP10x_SMP22x_Smart_Pyranometers_V20.pdf", title: "SMP10x and SMP22x Smart Pyranometers Operational Manual", version: "0374214 | 02-0326 (V20), data model 108", date: "2026-03", official: true}
    access_status: "documented, simulated for demo"
    device: {model: "Kipp & Zonen SMP10x (IO_DEVICE_TYPE = 635)", firmware: "IO_DATAMODEL_VERSION must be >= 108", accessories: "RS-485 Modbus RTU (factory default 19200 baud, even parity, 8 data bits, 1 stop bit, address 1); no internal data memory"}
    acquisition: {path: "local documented read interface: Modbus RTU function 0x04 Read input register", collector: "site Modbus collector (simulated); manual suggests 1 s sampling with 1-minute averages", authorization: "site collector permission (not established)"}
    cadence: {native: "response time < 0.7 s (63%), < 2 s (95%)", chosen_polling_s: 60}
    conventions:
      register_numbering: "PDU address + 1 = Modbus register number (manual 15.5 legend)"
      scale_factor: "IO_SCALE_FACTOR (PDU 4): 2 => x/100, 1 => x/10, 0 => x, -1 => x*10; applies to radiation registers 5, 6, 10, 11"
      night_offset: "Zero offset type A produces small negative output (total zero offset < 9 W/m2 for SMP10x); not an equipment fault. IO_CLAMP_IRR coil (default 0) can prohibit negatives."
      mounting: "POA only if registry mounting says in-plane; include one horizontal/GHI test case."
      invalid_sentinel: {value: null, evidence_status: documented, note: "validity via IO_STATUS_FLAGS bit 0 IO_VOID_DATA_FLAG (invalid data) and overflow/underflow bits; no sentinel value"}
    fields:
      - {native: "IO_DEVICE_TYPE", register: 1, address: 0, type: U16, signed: false, scale: 1, unit: none, word_order: n/a, invalid_sentinel: null, canonical_metric: null, boundary: null, aggregation: identity, requirement_class: integration_required, evidence_status: documented, source_ref: "KZ-SMP 15.2, 15.6 (SMP10x = 635)", feature: "model check"}
      - {native: "IO_STATUS_FLAGS", register: 4, address: 3, type: U16, signed: false, scale: 1, unit: none, bits: {0: IO_VOID_DATA_FLAG invalid data, 1: overflow, 2: underflow, 3: error, 4: ADC error, 5: DAC error, 6: calibration checksum error, 7: NV update failed, 8: power failure occurred, 10: RH sensor error, 11: desiccant saturation warning, 12: body temperature sensor error}, word_order: n/a, invalid_sentinel: null, canonical_metric: sensor_status_raw, boundary: null, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "KZ-SMP 15.6 register 3", feature: "data validity gate; native status evidence"}
      - {native: "IO_SCALE_FACTOR", register: 5, address: 4, type: S16, signed: true, scale: 1, unit: none, word_order: n/a, invalid_sentinel: null, canonical_metric: null, boundary: null, aggregation: state, requirement_class: integration_required, evidence_status: documented, source_ref: "KZ-SMP 15.6 register 4", feature: "decode of radiation register (wrong/absent scale => flag, never fit)"}
      - {native: "IO_SENSOR1_DATA (temperature compensated radiation)", register: 6, address: 5, type: S16, signed: true, scale: "per IO_SCALE_FACTOR", unit: W/m2, range: "-400 to 2000 W/m2 (serial output range)", word_order: n/a, invalid_sentinel: null, canonical_metric: irradiance_wm2, boundary: "sensor plane from registry (poa or horizontal)", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "KZ-SMP 15.2, 15.6 register 5; 14.1", feature: "irradiance-aware explanation"}
      - {native: "IO_BODY_TEMPERATURE", register: 9, address: 8, type: S16, signed: true, scale: 0.1, unit: degC, word_order: n/a, invalid_sentinel: null, canonical_metric: sensor_body_temperature_c, boundary: "instrument body (NOT ambient, NOT module)", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "KZ-SMP 15.2, 15.6 register 8", feature: "instrument context only"}
      - {native: "IO_ERROR_CODE", register: 27, address: 26, type: U16, signed: false, scale: 1, unit: none, word_order: n/a, invalid_sentinel: null, canonical_metric: sensor_status_raw, boundary: null, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "KZ-SMP 15.2 Error reports", feature: "raw error evidence (code meanings not mapped)"}
    not_selected:
      - {native: "FL_SENSOR1_DATA / FL_BODY_TEMPERATURE (F32)", address: [10006, 10014], reason: "Float32 word order not stated in manual"}
      - {native: "IO_RAW_SENSOR1_DATA, IO_STDEV_SENSOR1, RH, pressure, tilt", reason: "no planned feature"}

