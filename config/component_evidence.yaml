  m3_shelly_pro3em_rpc:
    family: meter
    outcome: include
    outcome_reason: >-
      EM.GetStatus and EMData.GetStatus keys, per-phase units, error vocabularies, CT 'reverse' configuration and
      EMData.ResetCounters are documented on official Shelly pages. Two semantics are inferred and must stay
      labelled: the unit of total_act_power (W) and the meaning of a negative act_power (returned/export
      direction). Directional energy (total_act / total_act_ret, Wh) is documented and is the authoritative basis.
    doc: {url: "https://shelly-api-docs.shelly.cloud/gen2/ComponentsAndServices/EM/", title: "Shelly Gen2 API EM / EMData / Pro 3EM pages", version: "page Version 1.0 (undated)", date: "accessed 2026-11-15", official: true}
    access_status: "documented, simulated for demo"
    device: {model: "Shelly Pro 3EM in 'triphase' profile (single em:0 + emdata:0)", firmware: ">= 1.1.0 (profiles supported since 1.1.0); declare exact version in registry", accessories: "Shelly CTs; ct_type must be set (else error ct_type_not_set)"}
    acquisition: {path: "local documented read interface: Gen2 RPC EM.GetStatus?id=0 and EMData.GetStatus?id=0", collector: "site LAN collector (simulated) adds capture time (GetStatus payloads carry no measurement timestamp)", authorization: "local network access; device auth if enabled (not established)"}
    cadence: {native: "EMData stores one-minute records; instantaneous refresh rate not stated", chosen_polling_s: 300}
    conventions:
      ct_orientation: {config: "EM.SetConfig reverse{a,b,c}: 'Reverse CT measurement direction' of active power and energy per phase (restart required)", evidence_status: documented, note: "Registry declares orientation; ingestion never auto-flips an unexplained negative reading."}
      power_sign: {value: "negative act_power = returned direction (export at a grid boundary)", evidence_status: inferred, note: "EM page does not explain the sign; consistent with EMData 'returned energy' wording."}
      reset: {method: "EMData.ResetCounters {id}", effect: "'Reset the total counters for the specified component'", evidence_status: documented, note: "Resettable counter: the known-reset defect case belongs to THIS profile. EMData.DeleteAllData also nullifies perpetual counters."}
      monophase_profile: "Pro 3EM 'monophase' profile exposes EM1/EM1Data instead; not modelled."
    fields:
      - {native: "total_act_power", path: "EM.GetStatus.total_act_power", type: "number|null", signed: true, scale: 1, unit: W, word_order: n/a, invalid_sentinel: null, canonical_metric: grid_net_kw, boundary: "configured CT boundary (grid_pcc for demo)", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, unit_evidence_status: inferred, sign_evidence_status: inferred, source_ref: "SH-EM status ('Sum of the active power on all phases')", feature: "grid exchange view"}
      - {native: "a_act_power / b_act_power / c_act_power", path: "EM.GetStatus.{a,b,c}_act_power", type: "number|null", signed: true, scale: 1, unit: W, word_order: n/a, invalid_sentinel: null, canonical_metric: phase_active_power_kw, boundary: "configured CT boundary", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, sign_evidence_status: inferred, source_ref: "SH-EM ('Phase A active power measurement value, [W]')", feature: "phase consistency test, CT orientation case"}
      - {native: "a_voltage / b_voltage / c_voltage", path: "EM.GetStatus.{a,b,c}_voltage", type: "number|null", signed: false, scale: 1, unit: V, word_order: n/a, invalid_sentinel: null, canonical_metric: phase_voltage_v, boundary: "measurement point", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "SH-EM ('Phase A voltage measurement value, [V]')", feature: "voltage evidence"}
      - {native: "a_current / b_current / c_current", path: "EM.GetStatus.{a,b,c}_current", type: "number|null", signed: false, scale: 1, unit: A, word_order: n/a, invalid_sentinel: null, canonical_metric: ac_current_a, boundary: "measurement point", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "SH-EM ('Phase A current measurement value, [A]')", feature: "optional phase detail"}
      - {native: "errors", path: "EM.GetStatus.errors", type: "array[string] (present only if non-empty)", signed: null, scale: null, unit: none, word_order: n/a, invalid_sentinel: null, enum: [power_meter_failure, phase_sequence, ct_type_not_set], canonical_metric: meter_status_raw, boundary: null, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "SH-EM", feature: "native error evidence (raw, no physical diagnosis)"}
      - {native: "a_errors / b_errors / c_errors", path: "EM.GetStatus.{a,b,c}_errors", type: "array[string] (shown if non-empty)", signed: null, scale: null, unit: none, word_order: n/a, invalid_sentinel: null, enum: ["out_of_range:active_power", "out_of_range:apparent_power", "out_of_range:voltage", "out_of_range:current"], canonical_metric: meter_status_raw, boundary: null, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "SH-EM", feature: "field-level quality flag for that phase"}
