[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "one-view-solar"
version = "0.1.0"
description = "Phase 2 normalized telemetry storage and authorized frontend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.0", "pydantic==2.14.3", "uvicorn==0.54.0",
    "PyYAML>=6.0", "numpy>=1.24", "pandas>=2.0", "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.2.0", "ruff==0.17.5", "jsonschema>=4.18"]

[tool.setuptools.packages.find]
include = ["backend*", "engine*"]

[tool.setuptools.package-data]
backend = ["migrations/*.sql", "fixtures/*.json"]

[tool.setuptools]
py-modules = ["scraper", "generate_demo", "mock_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
# Keep the independently tested phase 1 engine's formatting unchanged.
extend-exclude = ["engine", "generate_demo.py", "mock_server.py", "scraper.py", "tests/conftest.py", "tests/test_architecture.py", "tests/test_http_replay.py", "tests/test_outcomes.py", "tests/test_semantics.py", "tests/test_time.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
