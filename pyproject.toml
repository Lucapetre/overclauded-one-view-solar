[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "one-view-solar"
version = "0.1.0"
description = "Phase 2 normalized telemetry storage and authorized frontend API"
requires-python = ">=3.11"
dependencies = ["fastapi==0.163.0", "pydantic==2.14.3", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.2.0", "ruff==0.17.5"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["migrations/*.sql", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
