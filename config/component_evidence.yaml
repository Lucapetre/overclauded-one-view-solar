  # =====================================================================================================
  b1_victron_gx_battery_modbus:
    family: battery
    outcome: narrow
    outcome_reason: >-
      Official register list retrieved and parsed. Battery service registers for voltage, current, SoC,
      temperature, alarms and capacity are verified with types and scale factors. Narrowed: int32 battery power
      (256) is not used because 32-bit word order is not documented (the int16 variant 258 is used); BMS
      limit registers 305-308 are conditional ('Supported by third-party CAN.Bus batteries and Lynx NG', not by
      all Victron products); no invalid sentinel is documented; SoH/cell registers exist but are not used.
    doc: {url: "https://www.victronenergy.com/upload/documents/CCGX-Modbus-TCP-register-list-3.81.xlsx", title: "CCGX/GX Modbus-TCP register list", version: "3.81 (Rev 54 in 'Document versions'; modified 2026-10-06)", date: "2026-10-06", official: true}
    access_status: "documented, simulated for demo"
    device: {model: "Victron GX device (e.g. Cerbo GX) with a CAN-bus BMS lithium battery appearing as service com.victronenergy.battery", firmware: "Venus OS matching register list 3.81 (declare in registry; unit IDs dynamic since Venus 2.60)", accessories: "CAN-bus BMS battery; Modbus-TCP server enabled on GX. A BMV/SmartShunt variant is a battery MONITOR, not a BMS: limits 305-308 then unavailable."}
    acquisition: {path: "local documented read interface: Modbus-TCP on GX, function code 3 or 4 (no difference per FAQ), unit-id of the battery service", collector: "site LAN collector (simulated) storing raw 16-bit words", authorization: "LAN access + Modbus-TCP enabled by owner (not established)"}
    cadence: {native: "not specified", chosen_polling_s: 300}
    conventions:
      address: "Address column is the data address used in the request (FAQ example: 'set the data address of the first request register to 3'); no separate 1-based register number is used in this list."
      scale: "value = raw / Scalefactor (FAQ: 'Divide it by 10, as specified in cell E3'; Range column e.g. uint16 /100 -> '0 to 655.35')"
      unit_id: {preferred: 225, device_instance: 512, remark: "CAN-bus BMS (Unit ID mapping sheet). Since Venus 2.60 Unit IDs are assigned dynamically: read Settings -> Integrations -> Modbus TCP server -> Available services. Configure, do not hardcode."}
      errors: "Modbus exceptions per FAQ: 0x02 IllegalDataAddress (register does not exist), 0x0A GatewayPathUnavailable, 0x0B GatewayTargetDeviceFailedToRespond; 'A canbus-connected lithium battery might not have all those parameters available.'"
      invalid_sentinel: {value: null, evidence_status: documented, note: "no sentinel value documented for these battery registers"}
      current_sign: {value: "+ battery being charged / - being discharged (native)", evidence_status: documented, note: "canonical battery convention is +discharge: invert with provenance"}
    fields:
      - {native: "Battery voltage /Dc/0/Voltage", address: 259, type: uint16, signed: false, scale: "divide by 100", unit: "V DC", word_order: n/a, invalid_sentinel: null, canonical_metric: battery_voltage_v, boundary: dc_battery, aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST Field list row com.victronenergy.battery 259", feature: "battery state evidence, voltage anomaly"}
      - {native: "Current /Dc/0/Current", address: 261, type: int16, signed: true, scale: "divide by 10", unit: "A DC", word_order: n/a, invalid_sentinel: null, canonical_metric: battery_current_a, boundary: dc_battery, aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 261 ('Postive: battery begin charged. Negative: battery being discharged')", feature: "charge/discharge direction, limit compliance"}
      - {native: "Battery power /Dc/0/Power (older 16-bit variant of 256)", address: 258, type: int16, signed: true, scale: "divide by 1", unit: W, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_net_kw, boundary: dc_battery, aggregation: instantaneous, requirement_class: optional, evidence_status: documented, sign_evidence_status: inferred, source_ref: "VE-REGLIST 258", feature: "battery power view (sign assumed same as current: + charging; invert to canonical)", notes: "int16 saturates at +-32767 W; acceptable for demo battery sizes. 256 int32 not used (word order undocumented)."}
      - {native: "State of charge /Soc", address: 266, type: uint16, signed: false, scale: "divide by 10", unit: "%", word_order: n/a, invalid_sentinel: null, canonical_metric: soc_pct, boundary: battery, aggregation: last_valid_instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 266 (range 0 to 6553.6)", feature: "battery-assisted planning (SoC). Values > 100 are quarantined, never clamped."}
      - {native: "Battery temperature /Dc/0/Temperature", address: 262, type: int16, signed: true, scale: "divide by 10", unit: degC, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_temperature_c, boundary: battery, aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 262", feature: "temperature context; thresholds are demo policy unless an alarm register is set"}
      - {native: "Capacity /Capacity", address: 309, type: uint16, signed: false, scale: "divide by 10", unit: Ah, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_capacity_ah, boundary: battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 309", feature: "usable capacity basis (energy basis derived with nominal voltage => label derived)"}
      - {native: "Max charge current /Info/MaxChargeCurrent", address: 307, type: uint16, signed: false, scale: "divide by 10", unit: "A DC", word_order: n/a, invalid_sentinel: null, canonical_metric: battery_max_charge_current_a, boundary: dc_battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 307 ('Not supported by all Victron products. Supported by third-party CAN.Bus batteries and Lynx NG.')", feature: "BMS-reported charge limit for battery-assisted planning; absent => no battery flexibility promise", availability: "only when the declared battery is a CAN-bus BMS / Lynx NG"}
      - {native: "Max discharge current /Info/MaxDischargeCurrent", address: 308, type: uint16, signed: false, scale: "divide by 10", unit: "A DC", word_order: n/a, invalid_sentinel: null, canonical_metric: battery_max_discharge_current_a, boundary: dc_battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 308", feature: "BMS-reported discharge limit (derating case observable here)", availability: "only CAN-bus BMS / Lynx NG"}
      - {native: "Max charge voltage /Info/MaxChargeVoltage", address: 305, type: uint16, signed: false, scale: "divide by 10", unit: "V DC", word_order: n/a, invalid_sentinel: null, canonical_metric: battery_max_charge_voltage_v, boundary: dc_battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 305", feature: "limit context", availability: "only CAN-bus BMS / Lynx NG"}
      - {native: "Min discharge voltage /Info/BatteryLowVoltage", address: 306, type: uint16, signed: false, scale: "divide by 10", unit: "V DC", word_order: n/a, invalid_sentinel: null, canonical_metric: battery_min_discharge_voltage_v, boundary: dc_battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 306", feature: "limit context", availability: "only CAN-bus BMS / Lynx NG"}
      - {native: "Low voltage alarm /Alarms/LowVoltage", address: 268, type: uint16, signed: false, scale: "divide by 1", unit: none, enum: {0: "No alarm", 2: "Alarm"}, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_alarm_raw, boundary: battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 268", feature: "reported battery fault => planner restriction"}
      - {native: "High voltage alarm /Alarms/HighVoltage", address: 269, type: uint16, signed: false, scale: "divide by 1", unit: none, enum: {0: "No alarm", 2: "Alarm"}, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_alarm_raw, boundary: battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 269", feature: "reported battery fault"}
      - {native: "Low State-of-charge alarm /Alarms/LowSoc", address: 272, type: uint16, signed: false, scale: "divide by 1", unit: none, enum: {0: "No alarm", 2: "Alarm"}, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_alarm_raw, boundary: battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 272", feature: "reported battery state"}
      - {native: "Low temperature alarm /Alarms/LowTemperature", address: 273, type: uint16, signed: false, scale: "divide by 1", unit: none, enum: {0: "No alarm", 2: "Alarm"}, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_alarm_raw, boundary: battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 273", feature: "reported battery fault"}
      - {native: "High temperature alarm /Alarms/HighTemperature", address: 274, type: uint16, signed: false, scale: "divide by 1", unit: none, enum: {0: "No alarm", 2: "Alarm"}, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_alarm_raw, boundary: battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 274", feature: "reported battery fault (documented status, not a universal threshold)"}
      - {native: "High charge current alarm /Alarms/HighChargeCurrent", address: 320, type: uint16, signed: false, scale: "divide by 1", unit: none, enum: {0: "No alarm", 2: "Alarm"}, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_alarm_raw, boundary: battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 320", feature: "reported battery fault"}
      - {native: "High discharge current alarm /Alarms/HighDischargeCurrent", address: 321, type: uint16, signed: false, scale: "divide by 1", unit: none, enum: {0: "No alarm", 2: "Alarm"}, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_alarm_raw, boundary: battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 321", feature: "reported battery fault"}
      - {native: "Internal failure alarm /Alarms/InternalFailure", address: 323, type: uint16, signed: false, scale: "divide by 1", unit: none, enum: {0: "No alarm", 2: "Alarm"}, word_order: n/a, invalid_sentinel: null, canonical_metric: battery_alarm_raw, boundary: battery, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "VE-REGLIST 323", feature: "reported battery fault => planner restriction"}
    not_selected:
      - {native: "Battery power int32", address: 256, reason: "32-bit word order not documented in list or FAQ"}
      - {native: "Alarm /Alarms/Alarm", address: 267, reason: "deprecated, 'Value is always 0'"}
      - {native: "State of health /Soh", address: 304, reason: "exists for CAN-bus BMS but no planned feature uses SoH; spec forbids SoH claims beyond exposed data"}
      - {native: "Min/Max cell temperature, min/max cell voltage", address: [318, 319, 1290, 1291], reason: "not needed; no cell-level claims"}
      - {native: "State /State, Error /ErrorCode", address: [1282, 1283], reason: "FAQ: registers 1282-1301 are for Lynx Ion / Lynx BMS; not applicable to a generic CAN-bus BMS"}
      - {native: "History registers 281-302", address: "281-302", reason: "'Not supported by CAN.Bus BMS batteries'"}

