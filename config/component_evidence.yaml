# Component source evidence registry (PHASE 1 feasibility gate output).
#
# Consumed by the component generator / component profiles. It records ONLY what the pinned public
# documentation establishes for each candidate profile, so that generated fixtures never contain a native
# field, register, type, scale or semantic that was not verified. Human-readable version with reasoning:
# docs/COMPONENT_SOURCE_NOTES.md.
#
# Rules for consumers:
#   * outcome: include | narrow | exclude.  exclude => generate NOTHING for that profile.
#   * fields: the complete allowlist of native fields for include/narrow profiles. Anything not listed is
#     unavailable (do not generate it, do not fake it as null-with-meaning).
#   * evidence_status: documented | inferred | explicitly_simulated  (inferred items must stay visible in
#     provenance; they are configuration choices, not vendor facts).
#   * requirement_class keeps the existing three telemetry classes unchanged:
#     integration_required | vendor_response_required | optional.
#   * access_status for every profile is "documented, simulated for demo" or "not established". Public
#     documentation does NOT prove PPC permission or a working connection. All values are synthetic.
#   * address = zero-based Modbus PDU/protocol address (what goes in the frame); register = vendor's
#     register number where the vendor uses a separate 1-based numbering.
#   * canonical_metric names marked in `proposed_canonical_metrics` do not yet exist in
#     config/provider_profiles.yaml and must be added there (with bounds) by the profile author.
#   * Collector envelope metadata (capture time, collector id, request window) is OUR metadata and may be
#     simulated; it is never presented as a device-emitted field.
registry_version: "2026.11.15-phase1"
researched_on: "2026-11-15"
synthetic_notice: >-
  Evidence is documentation-only. No vendor login, credential, device or live API was used. Values generated
  from these profiles are synthetic demonstration data.

proposed_canonical_metrics:
  grid_net_kw:               {unit: kW, kind: power, sign: "+import / -export, only on a declared grid/PCC boundary"}
  lifetime_grid_import_kwh:  {unit: kWh, kind: energy_counter_lifetime}
  lifetime_grid_export_kwh:  {unit: kWh, kind: energy_counter_lifetime}
  resettable_grid_import_kwh: {unit: kWh, kind: energy_counter_resettable}
  resettable_grid_export_kwh: {unit: kWh, kind: energy_counter_resettable}
  phase_active_power_kw:     {unit: kW, kind: power, sign: "+import / -export after configured boundary/CT orientation"}
  meter_status_raw:          {unit: none, kind: state}
  battery_voltage_v:         {unit: V, kind: voltage}
  battery_current_a:         {unit: A, kind: current, sign: "canonical +discharge / -charge (native Victron is +charge)"}
  battery_net_kw:            {unit: kW, kind: power, sign: "+discharge / -charge on the named boundary"}
  battery_alarm_raw:         {unit: none, kind: state}
  battery_max_charge_current_a:    {unit: A, kind: limit, description: "BMS-reported allowed charge current"}
  battery_max_discharge_current_a: {unit: A, kind: limit, description: "BMS-reported allowed discharge current"}
  battery_max_charge_voltage_v:    {unit: V, kind: limit}
  battery_min_discharge_voltage_v: {unit: V, kind: limit}
  battery_capacity_ah:       {unit: Ah, kind: capacity, description: "capacity basis reported by the battery service"}
  irradiance_wm2:            {unit: W/m2, kind: irradiance, description: "plane given ONLY by asset-registry mounting (poa | horizontal)"}
  reference_cell_temperature_c: {unit: degC, kind: temperature, description: "irradiance reference-cell temperature (not module, not ambient)"}
  module_temperature_c:      {unit: degC, kind: temperature, description: "back-of-module PV temperature sensor"}
  ambient_temperature_c:     {unit: degC, kind: temperature}
  sensor_body_temperature_c: {unit: degC, kind: temperature, description: "radiometer body temperature (not ambient, not module)"}
  sensor_status_raw:         {unit: none, kind: state}

