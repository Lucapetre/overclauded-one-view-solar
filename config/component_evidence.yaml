profiles:
  # =====================================================================================================
  m1_schneider_iem3255_modbus:
    family: meter
    outcome: include
    outcome_reason: >-
      Model-specific register table, types, units, register-vs-address rule, model applicability (iEM3255 has
      Modbus, four-quadrant energy and electrical measurements) and non-resettable total energy are documented.
      Word order of multi-register values is NOT stated in the manual and is a declared configuration (inferred).
    doc: {url: "https://download.se.com/files?filename=User+guide&p_Doc_Ref=DOCA0005EN", title: "iEM3100/iEM3200/iEM3300 series User manual", version: "DOCA0005EN-16", date: "05/2026", official: true}
    access_status: "documented, simulated for demo"
    device: {model: "Schneider Electric iEM3255 (iEM3200 series, CT inputs 1 A/5 A, VT inputs supported)", firmware: "not pinned by manual (Present Firmware Version register 1637 exists); declare in asset registry", accessories: "external CTs (and VTs if used); RS-485 Modbus RTU to a site collector/gateway"}
    acquisition: {path: "local documented read interface: Modbus RTU, function code 0x03 Read Holding Registers", collector: "site Modbus collector (simulated) storing raw 16-bit words + capture metadata", authorization: "site owner network/collector permission (not established)"}
    cadence: {native: "not specified by the manual", chosen_polling_s: 300}
    conventions:
      register_to_address: "address = register - 1 (manual: 'register = address + 1'; Address column is the value used in the Modbus frame)"
      word_order: {value: "high_word_first", evidence_status: inferred, note: "DOCA0005EN-16 does not state word or byte order for Float32/Int64. Configured; a wrong-order fixture must be flagged, never auto-repaired."}
      int64_signedness: {value: "decode as signed Int64, expect >= 0", evidence_status: documented, note: "Energy section says 'signed 64-bit integer'; the unit table describes Int64 as '64 bit unsigned integer' (internal inconsistency in the manual). Counters are non-negative in practice; a negative decode is flagged."}
      power_sign: {value: "+P = delivered/imported (source -> load); -P = received/exported", evidence_status: documented, source_ref: "DOCA0005EN-16 p.120 'Power flow' / quadrant table", note: "Grid meaning only when the meter is installed at the declared PCC with source side = grid."}
      invalid_sentinel: {value: null, evidence_status: documented, note: "No NaN/invalid sentinel is documented for these registers; non-finite Float32 is treated as invalid by OUR rule."}
    fields:
      - {native: "Total Active Power", register: 3060, address: 3059, address_hex: "0x0BF3", words: 2, type: Float32, signed: true, scale: 1, unit: kW, word_order: high_word_first, invalid_sentinel: null, canonical_metric: grid_net_kw, boundary: "configured (grid_pcc for demo site)", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "SE-DOCA0005EN p.67 Meter Data / Power (address = register - 1, p.56)", feature: "grid exchange view, discrepancy check"}
      - {native: "Active Power Phase 1/2/3", register: [3054, 3056, 3058], address: [3053, 3055, 3057], address_hex: ["0x0BED", "0x0BEF", "0x0BF1"], words: 2, type: Float32, signed: true, scale: 1, unit: kW, word_order: high_word_first, invalid_sentinel: null, canonical_metric: phase_active_power_kw, boundary: "configured", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "SE-DOCA0005EN pp.66-67", feature: "per-phase consistency test (sum vs total)"}
      - {native: "Voltage L1-N / L2-N / L3-N", register: [3028, 3030, 3032], address: [3027, 3029, 3031], address_hex: ["0x0BD3", "0x0BD5", "0x0BD7"], words: 2, type: Float32, signed: true, scale: 1, unit: V, word_order: high_word_first, invalid_sentinel: null, canonical_metric: phase_voltage_v, boundary: "configured", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "SE-DOCA0005EN p.66", feature: "voltage event evidence"}
      - {native: "I1/I2/I3 phase current", register: [3000, 3002, 3004], address: [2999, 3001, 3003], address_hex: ["0x0BB7", "0x0BB9", "0x0BBB"], words: 2, type: Float32, signed: true, scale: 1, unit: A, word_order: high_word_first, invalid_sentinel: null, canonical_metric: ac_current_a, boundary: "configured", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "SE-DOCA0005EN p.66", feature: "optional phase detail"}
      - {native: "Frequency", register: 3110, address: 3109, address_hex: "0x0C25", words: 2, type: Float32, signed: true, scale: 1, unit: Hz, word_order: high_word_first, invalid_sentinel: null, canonical_metric: grid_frequency_hz, boundary: "configured", aggregation: instantaneous, requirement_class: optional, evidence_status: documented, source_ref: "SE-DOCA0005EN p.67", feature: "optional context"}
      - {native: "Total Active Energy Import (cannot be reset)", register: 3204, address: 3203, address_hex: "0x0C83", words: 4, type: Int64, signed: true, scale: 1, unit: Wh, word_order: high_word_first, invalid_sentinel: null, canonical_metric: lifetime_grid_import_kwh, boundary: "configured (grid_pcc)", aggregation: cumulative_counter_lifetime, requirement_class: optional, evidence_status: documented, source_ref: "SE-DOCA0005EN p.67 'Energy values - 64-bit integer', 'Total Energy (cannot be reset)'", feature: "measured grid-energy verification (authoritative energy representation)", notes: "Preserve integer precision; never route through float. Do NOT inject resets into this counter."}
      - {native: "Total Active Energy Export (cannot be reset)", register: 3208, address: 3207, address_hex: "0x0C87", words: 4, type: Int64, signed: true, scale: 1, unit: Wh, word_order: high_word_first, invalid_sentinel: null, canonical_metric: lifetime_grid_export_kwh, boundary: "configured (grid_pcc)", aggregation: cumulative_counter_lifetime, requirement_class: optional, evidence_status: documented, source_ref: "SE-DOCA0005EN pp.67-68 (not applicable to iEM3150/iEM3250/iEM3350; applicable to iEM3255)", feature: "measured grid-energy verification"}
      - {native: "Energy Reset Date and Time", register: 3252, address: 3251, address_hex: "0x0CB3", words: 4, type: DATETIME, signed: false, scale: null, unit: none, word_order: "per DATETIME layout (4 words)", invalid_sentinel: null, canonical_metric: null, boundary: null, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "SE-DOCA0005EN p.67", feature: "audit of partial-counter resets (metadata only)"}
      - {native: "Diagnostics error status (bitmap; bit5 = Code 204 total active energy negative due to incorrect voltage or current connections)", register: 45000, address: 44999, address_hex: "0xAFC7", words: 1, type: Bitmap, signed: false, scale: null, unit: none, word_order: n/a, invalid_sentinel: null, canonical_metric: meter_status_raw, boundary: null, aggregation: state, requirement_class: optional, evidence_status: documented, source_ref: "SE-DOCA0005EN p.62 Modbus register list > System (register); p.126 diagnosis code 204 ('Metering continues')", feature: "wiring/data-quality evidence (raw, no physical diagnosis)"}
    not_selected:
      - {native: "Partial Active Energy Import", register: 3256, reason: "resettable (front panel, digital input, command 2020); a lifetime representation (3204/3208) is authoritative. No partial EXPORT register exists."}
      - {native: "Total Active Energy Import/Export Float32 kWh", register: [45100, 45102], reason: "alternative representation (Float32, kWh); single authoritative representation is the Int64 Wh pair"}

  # =====================================================================================================
  m2_fronius_smart_meter_solar_api:
    family: meter
    outcome: narrow
    outcome_reason: >-
      Endpoint, nesting, location-dependent directions and channel availability per meter model are documented
      in the official Fronius PDF. Narrowed: (a) the meter section does not tabulate channel units (W, Wh, V, A,
      Hz are inferred from channel names and example magnitudes); (b) Current_AC_Phase_* are ABSOLUTE values on
      the 63A-3 (no direction); (c) the per-device TimeStamp channel's epoch format is inferred from the example.
    doc: {url: "https://www.fronius.com/~/downloads/Solar%20Energy/Operating%20Instructions/42%2C0410%2C2012.pdf", title: "Fronius Solar API V1", version: "42,0410,2012,EN 021-15052025", date: "2025-05-15", official: true}
    access_status: "documented, simulated for demo"
    device: {model: "Fronius Smart Meter 63A-3 (article 43,0001,1473)", firmware: "channel table compatibility: hw=0 and sw=2.7, or hw=1 and (sw=2.9 or sw=3.0)", accessories: "connected to a Fronius Datamanager/inverter that serves the Solar API (Non Hybrid platform since 3.3.4-8; Fronius Hybrid always; GEN24/Tauro/Verto listed as 'planned in 1.13' - do not pair with GEN24 without separate evidence)"}
    acquisition: {path: "local documented read interface: HTTP GET /solar_api/v1/GetMeterRealtimeData.cgi?Scope=System (or Scope=Device&DeviceId=n)", collector: "site LAN collector (simulated)", authorization: "local network access to the datalogger (not established)"}
    cadence: {native: "not specified", chosen_polling_s: 300}
    conventions:
      nesting: "Head{RequestArguments, Status{Code,Reason,UserMessage}, Timestamp} + Body.Data.{DeviceId}.{channel}; Details{Serial, Model, Manufacturer} per device"
      head_timestamp: {meaning: "RFC3339 localtime of the datalogger; time the request was answered, NOT the time data was queried from the device", evidence_status: documented, source_ref: "FR-SOLARAPI Common response header (Listing: Head)"}
      units: {value: "PowerReal_* W; EnergyReal_WAC_* Wh; Voltage_* V; Current_* A; Frequency Hz", evidence_status: inferred, note: "meter section has no unit column; inferred from channel naming, example magnitudes (e.g. 19838697 energy, 232.3 voltage) and the API's use of base units without prefixes elsewhere"}
      sign_by_location:
        "0": {meaning: "grid interconnection point (primary meter, feed-in)", PowerReal_P_Sum_positive: "consuming from grid", PowerReal_P_Sum_negative: "feeding in to grid"}
        "1": {meaning: "load / consumption path (primary meter)", PowerReal_P_Sum_positive: "producing power", PowerReal_P_Sum_negative: "normal consumption"}
        "3": {meaning: "external generator (secondary meter, multiple)", PowerReal_P_Sum_positive: "generation", PowerReal_P_Sum_negative: "consumption"}
        "256-511": {meaning: "subloads (secondary meter, unique)", PowerReal_P_Sum_positive: "load is producing power", PowerReal_P_Sum_negative: "normal consumption"}
      counter_views: "EnergyReal_WAC_Sum_Consumed/Produced = meter-specific view; EnergyReal_WAC_Plus/Minus_Absolute = system (Solar.web) view. At location 0: Plus_Absolute = import, Minus_Absolute = export."
      missing_channels: "Inactive channels are not included and vary by meter/software version; a missing optional channel is not a fault."
    fields:
      - {native: "Details.Serial / Details.Model / Details.Manufacturer", path: "Body.Data.{id}.Details.*", type: string, signed: null, scale: null, unit: none, word_order: n/a, invalid_sentinel: null, canonical_metric: null, boundary: null, aggregation: identity, requirement_class: vendor_response_required, evidence_status: documented, source_ref: "FR-SOLARAPI 4.8.4 (m for 63A-3), Listing 42", feature: "device identity"}
      - {native: "Meter_Location_Current", path: "Body.Data.{id}.Meter_Location_Current", type: number, signed: false, scale: 1, unit: none, word_order: n/a, invalid_sentinel: null, canonical_metric: null, boundary: "selects sign interpretation; must equal the configured installation boundary", aggregation: state, requirement_class: vendor_response_required, evidence_status: documented, source_ref: "FR-SOLARAPI 4.8.5-4.8.7", feature: "flow-direction resolution (integration-critical; mismatch with registry => quarantine)"}
      - {native: "Enable", path: "Body.Data.{id}.Enable", type: number, signed: false, scale: 1, unit: none, word_order: n/a, invalid_sentinel: null, canonical_metric: null, boundary: null, aggregation: state, requirement_class: vendor_response_required, evidence_status: documented, source_ref: "FR-SOLARAPI 4.8.5 (1 enabled, 0 disabled)", feature: "quality gate"}
      - {native: "Visible", path: "Body.Data.{id}.Visible", type: number, signed: false, scale: 1, unit: none, word_order: n/a, invalid_sentinel: "0 = incomplete or outdated values", canonical_metric: null, boundary: null, aggregation: state, requirement_class: vendor_response_required, evidence_status: documented, source_ref: "FR-SOLARAPI 4.8.5 (1 use values, 0 incomplete or outdated values)", feature: "quality gate: Visible=0 => withhold values, coverage warning"}
      - {native: "TimeStamp (per device channel)", path: "Body.Data.{id}.TimeStamp", type: number, signed: false, scale: 1, unit: "s since Unix epoch (inferred)", word_order: n/a, invalid_sentinel: null, canonical_metric: null, boundary: null, aggregation: measurement_time, requirement_class: vendor_response_required, evidence_status: inferred, source_ref: "FR-SOLARAPI 4.8.4 channel table (m), Listing 43 example 1561364909", feature: "source time (format inferred; Head.Timestamp remains response time)"}
      - {native: "PowerReal_P_Sum", path: "Body.Data.{id}.PowerReal_P_Sum", type: number, signed: true, scale: 1, unit: W, word_order: n/a, invalid_sentinel: null, canonical_metric: grid_net_kw, boundary: "Meter_Location_Current=0 => grid_pcc (+import/-export); other locations are NOT grid", aggregation: instantaneous, requirement_class: vendor_response_required, evidence_status: documented, unit_evidence_status: inferred, source_ref: "FR-SOLARAPI 4.8.4, 4.8.6", feature: "grid exchange view"}
      - {native: "PowerReal_P_Phase_1/2/3", path: "Body.Data.{id}.PowerReal_P_Phase_n", type: number, signed: true, scale: 1, unit: W, word_order: n/a, invalid_sentinel: null, canonical_metric: phase_active_power_kw, boundary: "as PowerReal_P_Sum", aggregation: instantaneous, requirement_class: vendor_response_required, evidence_status: documented, unit_evidence_status: inferred, source_ref: "FR-SOLARAPI 4.8.4 (m for 63A-3)", feature: "phase consistency test"}
      - {native: "EnergyReal_WAC_Sum_Consumed", path: "Body.Data.{id}.EnergyReal_WAC_Sum_Consumed", type: number, signed: false, scale: 1, unit: Wh, word_order: n/a, invalid_sentinel: null, canonical_metric: lifetime_grid_import_kwh, boundary: "meter-specific view; = grid import only at Meter_Location_Current=0", aggregation: cumulative_counter_lifetime, requirement_class: vendor_response_required, evidence_status: documented, unit_evidence_status: inferred, source_ref: "FR-SOLARAPI 4.8.4, 4.8.5", feature: "measured grid-energy verification"}
      - {native: "EnergyReal_WAC_Sum_Produced", path: "Body.Data.{id}.EnergyReal_WAC_Sum_Produced", type: number, signed: false, scale: 1, unit: Wh, word_order: n/a, invalid_sentinel: null, canonical_metric: lifetime_grid_export_kwh, boundary: "meter-specific view; = grid export only at Meter_Location_Current=0", aggregation: cumulative_counter_lifetime, requirement_class: vendor_response_required, evidence_status: documented, unit_evidence_status: inferred, source_ref: "FR-SOLARAPI 4.8.4, 4.8.5", feature: "measured grid-energy verification"}
      - {native: "Voltage_AC_Phase_1/2/3", path: "Body.Data.{id}.Voltage_AC_Phase_n", type: number, signed: false, scale: 1, unit: V, word_order: n/a, invalid_sentinel: null, canonical_metric: phase_voltage_v, boundary: "meter location", aggregation: instantaneous, requirement_class: vendor_response_required, evidence_status: documented, unit_evidence_status: inferred, source_ref: "FR-SOLARAPI 4.8.4 (m for 63A-3)", feature: "voltage evidence"}
      - {native: "Current_AC_Phase_1/2/3", path: "Body.Data.{id}.Current_AC_Phase_n", type: number, signed: false, scale: 1, unit: A, word_order: n/a, invalid_sentinel: null, canonical_metric: ac_current_a, boundary: "meter location", aggregation: instantaneous, requirement_class: vendor_response_required, evidence_status: documented, unit_evidence_status: inferred, source_ref: "FR-SOLARAPI 4.8.5 ('absolute values for 63A-3, 63A-1 and 50KA-3; only UL and TS meter provide directions')", feature: "magnitude only; never used for direction"}
      - {native: "Frequency_Phase_Average", path: "Body.Data.{id}.Frequency_Phase_Average", type: number, signed: false, scale: 1, unit: Hz, word_order: n/a, invalid_sentinel: null, canonical_metric: grid_frequency_hz, boundary: "meter location", aggregation: instantaneous, requirement_class: vendor_response_required, evidence_status: documented, unit_evidence_status: inferred, source_ref: "FR-SOLARAPI 4.8.4", feature: "optional context"}
      - {native: "Head.Timestamp", path: "Head.Timestamp", type: "string (RFC3339 localtime)", signed: null, scale: null, unit: none, word_order: n/a, invalid_sentinel: null, canonical_metric: null, boundary: null, aggregation: response_time, requirement_class: vendor_response_required, evidence_status: documented, source_ref: "FR-SOLARAPI common response header", feature: "response time only (never measurement time)"}
      - {native: "Head.Status.Code", path: "Head.Status.Code", type: integer, signed: false, scale: 1, unit: none, word_order: n/a, invalid_sentinel: "non-zero = request problem", canonical_metric: null, boundary: null, aggregation: state, requirement_class: vendor_response_required, evidence_status: documented, source_ref: "FR-SOLARAPI common response header (0 = OKAY)", feature: "transport/access failure detection"}

