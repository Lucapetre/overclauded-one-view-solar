  w3_campbell_toa5_station:
    family: weather
    outcome: include
    outcome_reason: >-
      TOA5 four-row header structure, TIMESTAMP/RECORD columns (units TS/RN), processing descriptors and CSV
      records are documented. Column names, units and attached sensors are OUR configured logger program, not
      universal Campbell fields. Missing-value token is configured as "NAN" (documented for Campbell's datalogger
      web API output; the TOA5 page itself is silent on missing values).
    doc: {url: "https://help.campbellsci.com/loggernet-manual/ln_manual/campbell_scientific_file_formats/toa5.htm", title: "LoggerNet manual - TOA5", version: "undated", date: "accessed 2026-11-15", official: true}
    access_status: "documented, simulated for demo"
    device: {model: "Campbell Scientific CR1000X datalogger (configured station, shared AREA resource)", firmware: "declare OS version in header row 1 (e.g. CR1000X.Std.xx) - configuration", accessories: "configured: POA pyranometer, ambient temperature sensor with radiation shield, back-of-module temperature sensor (declared in station metadata)"}
    acquisition: {path: "configured datalogger export: TOA5 file collected by LoggerNet (or equivalent)", collector: "LoggerNet-style file collection (simulated)", authorization: "station owner (not established)"}
    cadence: {native: "logger program scan/output interval (configured)", chosen_output_s: 60}
    conventions:
      header_row_1: "environment line, 8 fields: \"TOA5\", station name, datalogger model, serial number, OS version, program (DLD) name, program signature, table name"
      header_row_2: "field names; TIMESTAMP and RECORD first"
      header_row_3: "units; TIMESTAMP => TS, RECORD => RN; others as defined by the logger program"
      header_row_4: "data process abbreviation per field: Avg, Max, Min, Tot, Std, SMM...; Sample shown as Smp in the LoggerNet TOA5 example (CR1000X help lists Sample with no abbreviation); empty for TIMESTAMP/RECORD"
      timestamp: {format: "\"YYYY-MM-DD HH:MM:SS\" quoted (sub-second resolution possible)", meaning: "interval-ending label for Avg/Tot outputs (CR1000X examples: record 14:27:00 = average 14:26:01-14:27:00)", timezone: "logger clock - must be configured (no offset in file)", evidence_status: documented}
      missing_token: {value: "NAN", evidence_status: documented, source_ref: "CS-DLAPI 1.0.3 ('Invalid or not-a-number floating-point values are written as the string \"NAN\"')", note: "configured for our station; TOA5 page does not cover missing values"}
    fields:
      - {native: "TIMESTAMP", column: TIMESTAMP, type: "quoted timestamp string", signed: null, scale: null, unit: TS, word_order: n/a, invalid_sentinel: null, canonical_metric: null, boundary: null, aggregation: "interval end", requirement_class: integration_required, evidence_status: documented, source_ref: "CS-TOA5; CS-CR1000X-TABLES", feature: "source time"}
      - {native: "RECORD", column: RECORD, type: integer, signed: false, scale: 1, unit: RN, word_order: n/a, invalid_sentinel: null, canonical_metric: null, boundary: null, aggregation: record_number, requirement_class: integration_required, evidence_status: documented, source_ref: "CS-TOA5", feature: "dedup/out-of-order detection"}
      - {native: "POA_Irr_Avg (configured column name)", column: POA_Irr_Avg, type: float, signed: true, scale: 1, unit: W/m^2, processing: Avg, word_order: n/a, invalid_sentinel: "NAN", canonical_metric: irradiance_wm2, boundary: "poa (configured station metadata)", aggregation: interval_average, requirement_class: optional, evidence_status: explicitly_simulated, source_ref: "column = our logger-program configuration; format CS-TOA5", feature: "irradiance-aware explanation"}
      - {native: "AirT_C_Avg (configured)", column: AirT_C_Avg, type: float, signed: true, scale: 1, unit: Deg C, processing: Avg, word_order: n/a, invalid_sentinel: "NAN", canonical_metric: ambient_temperature_c, boundary: "ambient (shielded sensor)", aggregation: interval_average, requirement_class: optional, evidence_status: explicitly_simulated, source_ref: "configuration", feature: "weather context"}
      - {native: "ModT_C_Avg (configured)", column: ModT_C_Avg, type: float, signed: true, scale: 1, unit: Deg C, processing: Avg, word_order: n/a, invalid_sentinel: "NAN", canonical_metric: module_temperature_c, boundary: "back of module", aggregation: interval_average, requirement_class: optional, evidence_status: explicitly_simulated, source_ref: "configuration", feature: "PV performance review; missing stays missing (never replaced by ambient)"}
